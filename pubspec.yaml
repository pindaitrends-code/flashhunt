name: flashhunt
description: FlashHunt - Flash Sale Detector Otomatis
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Core
  permission_handler: ^11.3.0
  shared_preferences: ^2.2.3
  web_socket_channel: ^3.0.1
  http: ^1.2.1
  
  # Notifications
  flutter_local_notifications: ^17.2.1
  flutter_foreground_task: ^7.0.0
  
  # Device Info
  device_apps: ^2.2.0  # ✅ Untuk scan aplikasi terinstal
  
  # UI (Opsional - jika mau tampilan lebih keren)
  flutter_svg: ^2.0.10
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  # assets:
  #   - assets/images/
  #   - assets/icons/